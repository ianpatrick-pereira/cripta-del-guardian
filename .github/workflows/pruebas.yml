name: Pruebas
on:
  push:
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: cripta.html está al día con src/
        run: npm run check
      - name: Revisión de tipos
        run: npm run tipos
      - name: Pruebas automáticas
        run: npm test
      # cómo se ve el juego en escritorio y en el celular: se descargan desde la ejecución (sección Artifacts)
      - name: Capturas
        run: npm run capturas
      - uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: pruebas/capturas/
          retention-days: 14

  # Balance con bots (unos 4 minutos, en paralelo con las pruebas): comprueba pruebas/balance-limites.jsonc.
  # Los avisos (⚠) solo se muestran; un límite de «fallo» roto pone la ejecución en rojo.
  # El informe completo sale en el resumen de la ejecución (pestaña Summary de GitHub Actions).
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Límites de balance
        run: npm run balance-ci

  # Solo en main y solo si las pruebas pasaron: publica cripta.html en GitHub Pages
  publicar:
    needs: [pruebas, balance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Preparar la web
        run: |
          # página completa (con <!doctype> y la etiqueta viewport para celulares)
          node build.js --web web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: despliegue
        uses: actions/deploy-pages@v4
